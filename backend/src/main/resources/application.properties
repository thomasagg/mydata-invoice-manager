spring.application.name=mydata-invoice-manager

# database connection
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/invoicedb
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# let hibernate create/update tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT settings
jwt.secret=${JWT_SECRET:changethisinproductionpleaseusealongrandombstring1234567890abcdef}
jwt.expiration=86400000

# myDATA AADE credentials
mydata.user-id=${MYDATA_USER_ID:}
mydata.subscription-key=${MYDATA_SUBSCRIPTION_KEY:}
mydata.base-url=${MYDATA_BASE_URL:https://mydataapidev.aade.gr}

# CORS - allow requests from the frontend dev server
app.cors.allowed-origins=http://localhost:5173

server.port=8080
